name: VM3 in-place security gate 260928

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  vm3-inplace-security-gate-260928:
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Controlled body-driven security gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PR_BODY" == *"VM3_INPLACE_GATE_FAIL_260928"* ]]; then
            echo "controlled gate failure"
            exit 1
          fi
          echo "controlled gate success"
