pull_request_rules:
  - name: VM3 approved-reviews-by current permission freshness
    conditions:
      - title = VM3 APPROVED REVIEWER PERMISSION FRESHNESS 260920
      - approved-reviews-by = livastic-vm3-secondary-20260911
      - -label = vm3-approved-reviewer-current-260920
    actions:
      label:
        add:
          - vm3-approved-reviewer-current-260920

  - name: vm3 large pr hidden sensitive file probe2 260928
    conditions:
      - title = VM3 LARGE PR FILE TRUNCATION PROBE2 260928
      - files ~= ^zzzz-sensitive/security-policy\.txt$
    actions:
      comment:
        message: VM3_LARGE_PR_HIDDEN_FILE_MATCH2_260928

  - name: vm3 review-requested external write positive 260929
