pull_request_rules:
  - name: VM3 approved-reviews-by current permission freshness
    conditions:
      - title = VM3 APPROVED REVIEWER PERMISSION FRESHNESS 260920
      - approved-reviews-by = livastic-vm3-secondary-20260911
      - -label = vm3-approved-reviewer-current-260920
    actions:
      label:
        add:
          - vm3-approved-reviewer-current-260920

  - name: vm3 large pr hidden sensitive file probe2 260928
    conditions:
      - title = VM3 LARGE PR FILE TRUNCATION PROBE2 260928
      - files ~= ^zzzz-sensitive/security-policy\.txt$
    actions:
      comment:
        message: VM3_LARGE_PR_HIDDEN_FILE_MATCH2_260928

  - name: VM3 large PR hidden sensitive protected merge 260929
    conditions:
      - title = VM3 LARGE PR SAME REPO HIDDEN FILE 260929
      - -files ~= ^zzzz-sensitive/security-policy\.txt$
    actions:
      merge:
        method: merge

  - name: Keep PRs up to date
    conditions:
      - -draft
      - "#commits-behind >= 1"
    actions:
      update:

merge_queue:
  mode: isolated
  max_parallel_checks: 2

scopes:
  source:
    files:
      ordinary:
        include:
          - ordinary/**/*
  barrier_files:
    include:
      - barrier/**/*

queue_rules:
  - name: vm3-isobar-260929
    batch_size: 1
    queue_conditions:
      - base = vm3-isobar-target-260929
    merge_conditions:
      - check-success = vm3-isobar-release-260929
    merge_method: merge

  - name: vm3-isobar-impact-260929
    batch_size: 1
    queue_conditions:
      - base = vm3-isobar-impact-target-260929
    merge_conditions:
      - check-success = vm3-isobar-security
      - check-success = vm3-isobar-impact-release-260929
    merge_method: merge
